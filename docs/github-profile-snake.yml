# Optional animation for the GitHub profile README: a snake that eats your contribution graph.
# Copy to .github/workflows/snake.yml in the profile repository (HassanAlsadah/HassanAlsadah),
# run it once from the Actions tab, then uncomment the snake block in the profile README.

name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#d63c6f&color_dots=#161b22,#2d1f6b,#4a33b5,#6a4cf0,#8b6cf6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
